<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用例管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1002;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 2rem;
            border-radius: 0.5rem;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close {
            color: #9ca3af;
            float: right;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #1f2937;
        }

        .modal-lg {
            max-width: 1000px;
        }

        /* 底部滑出半屏弹窗样式 */
        .bottom-sheet-modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .bottom-sheet-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #fefefe;
            border-radius: 1rem 1rem 0 0;
            padding: 2rem;
            height: 80vh;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .bottom-sheet-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            color: #9ca3af;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
            line-height: 1;
        }

        .bottom-sheet-close:hover {
            color: #1f2937;
        }

        .param-display {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            padding: 0.75rem;
            margin-top: 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
        }

        .param-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.25rem;
        }

        .param-section {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-left: 3px solid #3b82f6;
            background-color: #f0f9ff;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">
    <!-- 创建用例弹窗 -->
    <div id="createCaseModal" class="bottom-sheet-modal">
        <div class="bottom-sheet-content">
            <span class="bottom-sheet-close">&times;</span>
            <h2 class="text-2xl font-bold mb-6">创建用例</h2>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="create_case_name" class="block text-sm font-medium text-gray-700 mb-1">用例名称</label>
                    <input type="text" id="create_case_name" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="create_case_annotation" class="block text-sm font-medium text-gray-700 mb-1">用例注释</label>
                    <input type="text" id="create_case_annotation" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">添加 API</label>
                <button id="add_api_in_create" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 flex items-center gap-2">
                    <i class="fas fa-plus"></i> 添加 API
                </button>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">已添加的 API 列表</label>
                <div class="overflow-x-auto max-h-64 overflow-y-auto border border-gray-200 rounded-md">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Using ID</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">API ID</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">名称</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">方法</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">路径</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">预期结果</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">全局变量</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="create_case_api_list" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="7" class="px-3 py-2 text-center text-sm text-gray-500">暂无 API</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button id="cancel_create_case" class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-6 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">取消</button>
                <button id="confirm_create_case" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">确定</button>
            </div>
        </div>
    </div>

    <!-- 选择 API 列表弹窗 -->
    <div id="selectApiListModal" class="modal">
        <div class="modal-content modal-lg">
            <span class="close-api-list">&times;</span>
            <h2 class="text-xl font-bold mb-4">选择 API</h2>
            <div class="overflow-x-auto max-h-96 overflow-y-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">名称</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">路径</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">方法</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="api_list_select_body" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 修改用例弹窗（统一编辑界面） -->
    <div id="editCaseModal" class="bottom-sheet-modal">
        <div class="bottom-sheet-content">
            <span class="bottom-sheet-close">&times;</span>
            <h2 class="text-2xl font-bold mb-6">编辑用例</h2>

            <input type="hidden" id="edit_case_id">

            <!-- 用例属性编辑区域 -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="edit_case_name" class="block text-sm font-medium text-gray-700 mb-1">用例名称</label>
                    <input type="text" id="edit_case_name" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="edit_case_annotation" class="block text-sm font-medium text-gray-700 mb-1">用例注释</label>
                    <input type="text" id="edit_case_annotation" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">添加 API</label>
                <button id="add_api_to_case_in_edit" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 flex items-center gap-2">
                    <i class="fas fa-plus"></i> 添加 API
                </button>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">已添加的 API 列表</label>
                <div class="overflow-x-auto max-h-64 overflow-y-auto border border-gray-200 rounded-md">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Using ID</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">API ID</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">名称</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">方法</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">路径</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">预期结果</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">全局变量</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="edit_case_api_list_body" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="7" class="px-3 py-2 text-center text-sm text-gray-500">暂无 API</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button id="cancel_edit_case" class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-6 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">取消</button>
                <button id="save_case_properties" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">保存</button>
            </div>
        </div>
    </div>
    <!-- 添加/编辑 API 到用例的弹窗 -->
    <div id="apiToCaseModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-api">&times;</span>
            <h2 class="text-xl font-bold mb-4" id="api_modal_title">添加 API 到用例</h2>
            <input type="hidden" id="api_using_id">
            <input type="hidden" id="current_case_id">

            <div class="mb-3">
                <label for="select_api_id" class="block text-sm font-medium text-gray-700">选择 API</label>
                <select id="select_api_id" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="api_method" class="block text-sm font-medium text-gray-700">请求方式</label>
                    <select id="api_method" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                    </select>
                </div>
                <div>
                    <label for="api_params" class="block text-sm font-medium text-gray-700">请求参数</label>
                    <input type="text" id="api_params" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
            </div>

            <div class="mb-3 mt-3">
                <label for="api_headers" class="block text-sm font-medium text-gray-700">请求头</label>
                <input type="text" id="api_headers" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div class="mb-3">
                <label for="api_body" class="block text-sm font-medium text-gray-700">请求体</label>
                <input type="text" id="api_body" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div class="mb-3">
                <label for="api_assert_result" class="block text-sm font-medium text-gray-700">预期结果</label>
                <input type="text" id="api_assert_result" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div class="mb-4">
                <label for="api_globla_values" class="block text-sm font-medium text-gray-700">全局变量</label>
                <input type="text" id="api_globla_values" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <button id="confirm_add_api" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">确定</button>
        </div>
    </div>

    <!-- API 详情弹窗（用于创建用例时添加 API） -->
    <div id="apiDetailModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <span class="close-api-detail">&times;</span>
            <h2 class="text-xl font-bold mb-4">API 完整参数信息</h2>
            <input type="hidden" id="detail_api_id">

            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-4">
                <p class="text-sm text-blue-700">请确认或修改以下API参数，这些参数将添加到用例中</p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">API 名称</label>
                    <input type="text" id="detail_api_name" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">API 路径</label>
                    <input type="text" id="detail_api_path" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-gray-100" readonly>
                </div>
            </div>

            <div class="param-section">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label for="detail_api_method" class="block text-sm font-medium text-gray-700">请求方式</label>
                        <select id="detail_api_method" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                    </div>
                    <div>
                        <label for="detail_api_params" class="block text-sm font-medium text-gray-700">请求参数</label>
                        <textarea id="detail_api_params" rows="2" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="detail_api_headers" class="block text-sm font-medium text-gray-700">请求头</label>
                    <textarea id="detail_api_headers" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                </div>

                <div class="mb-3">
                    <label for="detail_api_body" class="block text-sm font-medium text-gray-700">请求体</label>
                    <textarea id="detail_api_body" rows="4" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="detail_api_assert_result" class="block text-sm font-medium text-gray-700">预期结果</label>
                        <input type="text" id="detail_api_assert_result" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <div>
                        <label for="detail_api_globla_values" class="block text-sm font-medium text-gray-700">全局变量</label>
                        <input type="text" id="detail_api_globla_values" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
            </div>

            <button id="confirm_save_api_detail" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">保存并添加到用例</button>
        </div>
    </div>

    <div class="container mx-auto py-4 px-4">
        <button id="create_case_btn" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 mb-2">创建用例</button>

        <div class="bg-white p-4 rounded-md shadow-md mb-4">
            <h2 class="text-lg font-bold mb-2">查询用例</h2>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label for="query_case_name" class="block text-sm font-medium text-gray-700">用例名称</label>
                    <input type="text" id="query_case_name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="query_case_hoster" class="block text-sm font-medium text-gray-700">用例作者</label>
                    <input type="text" id="query_case_hoster" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
            </div>
            <button id="query_case_btn" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 mt-4">查询</button>
        </div>

        <div id="result_list" class="mt-4 bg-white p-4 rounded-md shadow-md">
            <h2 class="text-lg font-bold mb-2">用例列表</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200" id="case_table">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用例名称</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">作者</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">发布状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">API 数量</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用例注释</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="case_list_body" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

<script src="https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js"></script>
<script>
var baseUrl = "http://127.0.0.1:8000/api_platform/";
var createCasePath = "create_case/";
var updateCasePath = "update_case/";
var queryCasePath = "query_case/";
var deleteCasePath = "delete_case/";

var getUsingApiPath = "query_using_api/";
var postUsingApiPath = "create_using_api/";
var putUsingApiPath = "update_using_api/";
var deleteUsingApiPath = "delete_using_api/";

var queryApiPath = "query_api/";

var currentCaseId = null;
var isEditingApi = false;
var tempApiListForCreate = [];
var tempApiListForEdit = [];

$(document).ready(function () {
    // 显示创建用例弹窗
    $("#create_case_btn").click(function () {
        tempApiListForCreate = [];
        updateCreateCaseApiList();
        $("#createCaseModal").css("display", "block");
    });

    // 关闭创建用例弹窗
    $(".bottom-sheet-close, #cancel_create_case").click(function () {
        $("#createCaseModal").css("display", "none");
        tempApiListForCreate = [];
    });

    // 关闭编辑用例弹窗
    $(".close-edit").click(function () {

    $("#confirm_save_api_detail").click(function() {
        var apiId = $('#detail_api_id').val();
        var apiName = $('#detail_api_name').val();
        var apiPath = $('#detail_api_path').val();

        if (!apiId) {
            alert('请先选择 API');
            return;
        }

        var apiData = {
            api_id: parseInt(apiId),
            api_name: apiName || '',
            api_path: apiPath || '',
            params: $('#detail_api_params').val(),
            headers: $('#detail_api_headers').val(),
            body: $('#detail_api_body').val(),
            method: $('#detail_api_method').val(),
            assert_result: $('#detail_api_assert_result').val(),
            globla_values: $('#detail_api_globla_values').val()
        };

        // 检查是否是编辑模式下更新API
        var isEditModeUpdate = $(this).data('is-edit-mode-update');
        var isEditModeAdd = $(this).data('is-edit-mode-add');

        if (isEditModeUpdate) {
            // 编辑模式更新：更新临时数据
            var apiUsingId = $(this).data('api-using-id');

            // 在临时列表中查找并更新
            var updateIndex = tempApiListForEdit.findIndex(function(item) {
                return item.api_using_id === apiUsingId;
            });

            if (updateIndex !== -1) {
                // 保留原有的 api_using_id
                apiData.api_using_id = apiUsingId;
                apiData._action = 'update'; // 标记为更新操作
                tempApiListForEdit[updateIndex] = apiData;
            }

            alert('API 信息已更新，请点击保存按钮提交');

            // 清除标记
            $('#confirm_save_api_detail').removeData('is-edit-mode-update');
            $('#confirm_save_api_detail').removeData('api-using-id');

            // 刷新编辑模式下的API列表显示
            updateEditCaseApiList();

        } else if (isEditModeAdd) {
            // 编辑模式添加：添加到临时列表
            apiData._action = 'add'; // 标记为新增操作

            tempApiListForEdit.push(apiData);
            alert('API 已添加到列表，请点击保存按钮提交');

            // 清除标记
            $('#confirm_save_api_detail').removeData('is-edit-mode-add');

            // 刷新编辑模式下的API列表显示
            updateEditCaseApiList();

        } else {
            // 创建模式：检查是否是更新操作
            var updateIndex = $(this).data('update-index');
            if (updateIndex !== undefined && updateIndex !== null) {
                // 更新现有项
                tempApiListForCreate[updateIndex] = apiData;
                $(this).removeData('update-index');
                alert('API 信息已更新');
            } else {
                // 新增项
                tempApiListForCreate.push(apiData);
                alert('API 已添加到列表');
            }

            updateCreateCaseApiList();
        }

        $('#apiDetailModal').hide();
    });

                withCredentials: true
            },
            success: function (response) {

                    tbody.append('<tr><td colspan="7" class="px-6 py-4 text-center text-sm text-gray-500">没有找到匹配的用例</td></tr>');

                            '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">已发布</span>' :
                            '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">未发布</span>';
                        row.append("<td class='px-6 py-4 whitespace-nowrap text-sm'>" + publishBtn + "</td>");

                        var apiCount = (caseItem.api_ids && Array.isArray(caseItem.api_ids)) ? caseItem.api_ids.length : 0;
                        row.append("<td class='px-6 py-4 whitespace-nowrap text-sm'>" + apiCount + "</td>");
                        row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (caseItem.annotation || '') + "</td>");

                        var actions = '<td class="px-6 py-4 whitespace-nowrap text-sm">';
                        actions += '<button class="edit-case-btn bg-yellow-500 hover:bg-yellow-600 text-white py-1 px-2 rounded text-xs mr-2" data-case-id="' + (caseItem.id || '') + '" data-case-name="' + (caseItem.name || '') + '" data-case-hoster="' + (caseItem.hoster_name || '') + '" data-case-publish="' + (caseItem.publish ? '1' : '0') + '" data-case-annotation="' + (caseItem.annotation || '') + '" data-api-count="' + apiCount + '">编辑</button>';
                        actions += '<button class="delete-case-btn bg-red-500 hover:bg-red-600 text-white py-1 px-2 rounded text-xs">删除</button>';
                        actions += '</td>';
                        row.append(actions);

            error: function (xhr, status, error) {

    function loadCaseApisForEdit(caseId) {
        var getUrl = baseUrl + getUsingApiPath;
        $.ajax({
            url: getUrl,
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({case_id: caseId}),
            xhrFields: {
                withCredentials: true
            },
            success: function(response) {
                var apiList = response.data || [];

                tempApiListForEdit = apiList.map(function(api) {

                        body: api.body,
                        assert_result: api.assert_result,

                });

        // 保存用例属性
    $("#save_case_properties").click(function () {
        var editCaseUrl = baseUrl + updateCasePath;
        var caseId = $('#edit_case_id').val();

        // 过滤掉已删除的API，获取当前有效的API列表
        var currentApiList = tempApiListForEdit.filter(function(api) {
            return api._action !== 'delete';
        });

        // 清理内部标记字段，并添加api_using_id字段
        var apiListToSubmit = currentApiList.map(function(api) {
            return {
                api_using_id: api.api_using_id || 0,  // 如果有api_using_id则使用，否则用0
                api_id: api.api_id,
                params: api.params || '',
                headers: api.headers || '',
                body: api.body || '',
                method: api.method || 'GET',
                assert_result: api.assert_result || '',
                globla_values: api.globla_values || ''
            };
        });

        // 判断是否有改动：需要与原始加载的数据进行比较
        var hasChanges = checkIfHasChanges(caseId, apiListToSubmit);

        if (!hasChanges) {
            alert('没有需要保存的变更');
            return;
        }

        // 构造提交数据

        var apiUsingIdsList = currentApiList.map(function(api) {
            return api.api_using_id;
        });

        var postData = {
            case_id: parseInt(caseId),
            case_name: $('#edit_case_name').val(),
            case_hoster: '',
            case_publish: false,
            case_desc: $('#edit_case_annotation').val(),
            api_data_list: apiListToSubmit,
            api_using_ids: apiUsingIdsList
        };

        // 发起请求
        $.ajax({
            url: editCaseUrl,
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(postData),
            xhrFields: {
                withCredentials: true
            },
            beforeSend: function(xhr, settings) {
                var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
                if (csrfToken) {
                    xhr.setRequestHeader("X-CSRFToken", csrfToken);
                }
            },
            success: function(response) {
                alert('用例保存成功');
                tempApiListForEdit = [];
                $('#editCaseModal').hide();
                performQuery();
            },
            error: function(xhr, status, error) {
                console.error('保存用例失败:', error);
                alert('保存用例失败：' + (xhr.responseJSON?.message || '请重试'));
            }
        });
    });

    // 检查是否有改动
    function checkIfHasChanges(caseId, newApiList) {
        // 首先检查用例基本信息是否有改动
        var originalCaseName = $('#edit_case_name').data('original-value') || '';
        var originalCaseAnnotation = $('#edit_case_annotation').data('original-value') || '';
        var currentCaseName = $('#edit_case_name').val();
        var currentCaseAnnotation = $('#edit_case_annotation').val();

        if (originalCaseName !== currentCaseName || originalCaseAnnotation !== currentCaseAnnotation) {
            return true;
        }

        // 然后检查API列表是否有改动
        // 从临时列表中获取原始数据（_action为'keep'的是原始数据）
        var originalApiList = tempApiListForEdit.filter(function(api) {
            return api._action === 'keep';
        }).map(function(api) {
            return {
                api_id: api.api_id,
                params: api.params || '',
                headers: api.headers || '',
                body: api.body || '',
                method: api.method || 'GET',
                assert_result: api.assert_result || '',
                globla_values: api.globla_values || ''
            };
        });

        // 如果长度不同，说明有新增或删除
        if (originalApiList.length !== newApiList.length) {
            return true;
        }

        // 比较每个API的各个字段
        for (var i = 0; i < newApiList.length; i++) {
            var newApi = newApiList[i];
            var originalApi = originalApiList.find(function(api) {
                return api.api_id === newApi.api_id;
            });

            // 如果是新增的API
            if (!originalApi) {
                return true;
            }

            // 比较各个字段
            if (newApi.params !== originalApi.params ||
                newApi.headers !== originalApi.headers ||
                newApi.body !== originalApi.body ||
                newApi.method !== originalApi.method ||
                newApi.assert_result !== originalApi.assert_result ||
                newApi.globla_values !== originalApi.globla_values) {
                return true;
            }
        }

        return false;
    }
