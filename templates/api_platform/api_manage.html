<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>api_manage_view</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 2rem;
            border-radius: 0.5rem;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close {
            color: #9ca3af;
            float: right;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #1f2937;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">
    {% csrf_token %}
    <!-- 创建接口弹窗 -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 class="text-xl font-bold mb-4">创建接口</h2>
            <div class="mb-3">
                <label for="api_name" class="block text-sm font-medium text-gray-700">接口名称</label>
                <input type="text" id="api_name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div class="mb-3">
                <label for="create_url" class="block text-sm font-medium text-gray-700">域名</label>
                <input type="text" id="create_url" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div class="mb-3">
                <label for="create_api_path" class="block text-sm font-medium text-gray-700">接口路径</label>
                <input type="text" id="create_api_path" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div class="mb-3">
                <label for="create_method" class="block text-sm font-medium text-gray-700">请求方式</label>
                <select id="create_method" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="create_headers" class="block text-sm font-medium text-gray-700">请求头</label>
                <input type="text" id="create_headers" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div class="mb-3">
                <label for="create_body" class="block text-sm font-medium text-gray-700">请求体</label>
                <input type="text" id="create_body" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="create_annotation" class="block text-sm font-medium text-gray-700">注释</label>
                <input type="text" id="create_annotation" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <button id="confirm_create" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">确定</button>
        </div>
    </div>
    <div class="container mx-auto py-4 px-4">
        <button id="create_api" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 mb-2">创建接口</button>
        <div class="bg-white p-4 rounded-md shadow-md">
            <h2 class="text-lg font-bold mb-2">查询接口</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="query_author" class="block text-sm font-medium text-gray-700">接口作者</label>
                    <input type="text" id="query_author" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="query_name" class="block text-sm font-medium text-gray-700">接口名称</label>
                    <input type="text" id="query_name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="query_url" class="block text-sm font-medium text-gray-700">域名</label>
                    <input type="text" id="query_url" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <div>
                    <label for="query_api_url" class="block text-sm font-medium text-gray-700">地址</label>
                    <input type="text" id="query_api_url" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <div>
                    <label for="query_method" class="block text-sm font-medium text-gray-700">请求方式</label>
                    <select id="query_method" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                    </select>
                </div>
                <div>
                    <label for="query_headers" class="block text-sm font-medium text-gray-700">请求头</label>
                    <input type="text" id="query_headers" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="query_body" class="block text-sm font-medium text-gray-700">请求体</label>
                    <input type="text" id="query_body" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div class="col-span-2">
                    <label for="query_annotation" class="block text-sm font-medium text-gray-700">注释</label>
                    <input type="text" id="query_annotation" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
            </div>
            <button id="query_api" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 mt-4">查询</button>
        </div>
        <div id="result_list" class="mt-4 bg-white p-4 rounded-md shadow-md h-auto">
            <h2 class="text-lg font-bold mb-2">查询结果</h2>
            <ul id="results" class="list-disc list-inside"></ul>
        </div>
    </div>
</body>

<script src="https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js"></script>
<script>
    $(document).ready(function () {
        console.log("页面加载时的 cookies:", document.cookie);
        var baseUrl = "http://127.0.0.1:8000/api_platform/";
        var createApiPath = "create_api/";
        var queryApiPath = "query_api/";
        var deleteApiPath = "delete_api/";
        var updateApiPath = "update_api/";

        // 显示创建接口弹窗
        $("#create_api").click(function () {
            $("#myModal").css("display", "block");
        });

        // 关闭弹窗
        $(".close").click(function () {
            $("#myModal").css("display", "none");
        });

        // 点击确定创建接口
        $("#confirm_create").click(function () {
            var fullCreateApiUrl = baseUrl + createApiPath; // 拼接完整的接口地址

            var postData = {
                api_name: $("#api_name").val(),
                api_url: $("#create_url").val(),
                api_path: $("#create_api_path").val(),
                api_method: $("#create_method").val(),
                api_header: $("#create_headers").val(),
                api_body: $("#create_body").val(),
                api_params: $("#create_api_params").val(),  // 假设你有一个用于参数的输入框
                api_desc: $("#create_annotation").val()
            };

            $.ajax({ 
                url: fullCreateApiUrl,
                type: "POST",
                xhrFields: {
                    withCredentials: true
                },
                crossDomain: true,
                contentType: "application/json",  // 设置正确的 Content-Type 头
                data: JSON.stringify(postData),  // 将数据转换为 JSON 字符串
                beforeSend: function(xhr, settings) {
                    console.log("请求发送前 - cookies:", document.cookie);
                    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
                    if (csrfToken) {
                        xhr.setRequestHeader("X-CSRFToken", csrfToken);
                    }
                },
                success: function () {
                    console.log("成功请求");
                    alert("创建接口成功");
                    $("#myModal").css("display", "none");
                    // // 清空创建表单中的所有输入框
                    $("#create_name").val("");
                    $("#create_url").val("");
                    $("#create_api_path").val("");
                    $("#create_method").val("GET");
                    $("#create_headers").val("");
                    $("#create_body").val("");
                    $("#create_annotation").val("");
                },
                error: function (xhr, status, error) {
                    console.log("请求失败", xhr.responseText);
                    alert("请求失败: " + (xhr.responseText || error));
                }
            });
        });

        // 点击查询接口
        $("#query_api").click(function () {
            // 打印当前浏览器所有 cookies
            console.log("当前浏览器所有 cookies:", document.cookie);
            var fullQueryApiUrl = baseUrl + queryApiPath; // 拼接完整的接口地址

            var queryData = {
                author: $("#query_author").val(),
                name: $("#query_name").val(),
                url: $("#query_url").val(),
                api_url: $("#query_api_url").val(),
                method: $("#query_method").val(),
                headers: $("#query_headers").val(),
                body: $("#query_body").val(),
                annotation: $("#query_annotation").val()
            };

            $.ajax({
                url: fullQueryApiUrl,
                type: "POST",
                contentType: "application/json",  // 设置正确的 Content-Type 头
                data: JSON.stringify(queryData),  // 将数据转换为 JSON 字符串
                xhrFields: {
                    withCredentials: true  // 这会自动发送 cookies
                },
                success: function (data) {
                    // 清空结果列表
                    $("#results").empty();
                    // 遍历返回的数据并添加到列表中
                    if (data.length === 0) {
                        $("#results").append("<p>没有找到匹配的接口</p>");
                    } else {
                        data_list = data.data;
                        
                        // 创建表格
                        var table = $("<table class='min-w-full divide-y divide-gray-200'></table>");
                        var thead = $("<thead class='bg-gray-50'></thead>");
                        var tbody = $("<tbody class='bg-white divide-y divide-gray-200'></tbody>");
                        
                        // 表头
                        var headerRow = $("<tr></tr>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>接口作者</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>接口名称</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>接口域名</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>接口地址</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>请求方式</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>请求头</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>请求体</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>注释</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>发布</th>");
                        thead.append(headerRow);
                        
                        // 表体
                        $.each(data_list, function (index, item_data) {
                            var row = $("<tr class='hover:bg-gray-50'></tr>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.hoster_name || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900'>" + (item_data.name || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.base_url || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.api_path || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.method || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.headers || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.body || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.desc || '') + "</td>");
                            var publishClass = item_data.publish ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                            var publishText = item_data.publish ? '已发布' : '未发布';
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm'><span class='px-2 inline-flex text-xs leading-5 font-semibold rounded-full " + publishClass + "'>" + publishText + "</span></td>");
                            tbody.append(row);
                        });
                        
                        table.append(thead, tbody);
                        $("#results").append(table);
                    }
                },
                error: function (xhr, status, error) {
                    console.log("请求失败", error);
                }
            });
        });
    });
</script>

</html>
