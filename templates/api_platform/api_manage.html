<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 2rem;
            border-radius: 0.5rem;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close {
            color: #9ca3af;
            float: right;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #1f2937;
        }
                /* 编辑弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 2rem;
            border-radius: 0.5rem;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            animation: fadeIn 0.3s ease-out;
        }

        .close-edit {
            color: #9ca3af;
            float: right;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-edit:hover {
            color: #1f2937;
        }

    </style>
</head>

<body class="bg-gray-100 font-sans">
    <!-- 创建接口弹窗 -->

                <div>
                    <label for="query_name" class="block text-sm font-medium text-gray-700">接口名称</label>

<script src="https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js"></script>
<script>
var baseUrl = "http://127.0.0.1:8000/api_platform/";
var createApiPath = "create_api/";
var queryApiPath = "query_api/";
var deleteApiPath = "delete_api/";
var updateApiPath = "update_api/";
    $(document).ready(function () {
        console.log("页面加载时的 cookies:", document.cookie);


        // 显示创建接口弹窗
        $("#create_api").click(function () {
            $("#myModal").css("display", "block");
        });

        // 关闭弹窗
        $(".close").click(function () {
            $("#myModal").css("display", "none");
        });

        // 点击确定创建接口
        $("#confirm_create").click(function () {
            var fullCreateApiUrl = baseUrl + createApiPath; // 拼接完整的接口地址

            var postData = {
                api_name: $("#api_name").val(),
                api_url: $("#create_url").val(),
                api_path: $("#create_api_path").val(),
                api_method: $("#create_method").val(),
                api_header: $("#create_headers").val(),
                api_body: $("#create_body").val(),
                api_params: $("#create_api_params").val(),  // 假设你有一个用于参数的输入框
                api_desc: $("#create_annotation").val()
            };

            $.ajax({ 
                url: fullCreateApiUrl,
                type: "POST",
                xhrFields: {
                    withCredentials: true
                },
                crossDomain: true,
                contentType: "application/json",  // 设置正确的 Content-Type 头
                data: JSON.stringify(postData),  // 将数据转换为 JSON 字符串
                beforeSend: function(xhr, settings) {
                    console.log("请求发送前 - cookies:", document.cookie);
                    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
                    if (csrfToken) {
                        xhr.setRequestHeader("X-CSRFToken", csrfToken);
                    }
                },
                success: function () {
                    console.log("成功请求");
                    alert("创建接口成功");
                    $("#myModal").css("display", "none");
                    // // 清空创建表单中的所有输入框
                    $("#create_name").val("");
                    $("#create_url").val("");
                    $("#create_api_path").val("");
                    $("#create_method").val("GET");
                    $("#create_headers").val("");
                    $("#create_body").val("");
                    $("#create_annotation").val("");
                },
                error: function (xhr, status, error) {
                    console.log("请求失败", xhr.responseText);
                    alert("请求失败: " + (xhr.responseText || error));
                }
            });
        });

        // 点击查询接口
        $("#query_api").click(function () {
            // 打印当前浏览器所有 cookies
            console.log("当前浏览器所有 cookies:", document.cookie);
            var fullQueryApiUrl = baseUrl + queryApiPath; // 拼接完整的接口地址

            var queryData = {
                author: $("#query_author").val(),
                name: $("#query_name").val(),
                url: $("#query_url").val(),
                api_url: $("#query_api_url").val(),
                method: $("#query_method").val(),
                headers: $("#query_headers").val(),
                body: $("#query_body").val(),
                annotation: $("#query_annotation").val()
            };

            $.ajax({
                url: fullQueryApiUrl,
                type: "POST",
                contentType: "application/json",  // 设置正确的 Content-Type 头
                data: JSON.stringify(queryData),  // 将数据转换为 JSON 字符串
                xhrFields: {
                    withCredentials: true  // 这会自动发送 cookies
                },
                success: function (data) {
                    // 清空结果列表
                    $("#results").empty();
                    // 遍历返回的数据并添加到列表中
                    if (data.length === 0) {
                        $("#results").append("<p>没有找到匹配的接口</p>");
                    } else {
                        data_list = data.data;
                        
                        // 创建表格
                        var table = $("<table class='min-w-full divide-y divide-gray-200'></table>");
                        var thead = $("<thead class='bg-gray-50'></thead>");
                        var tbody = $("<tbody class='bg-white divide-y divide-gray-200'></tbody>");
                        
                        // 表头
                        var headerRow = $("<tr></tr>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>ID</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>接口作者</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>接口名称</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>接口域名</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>接口地址</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>请求方式</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>请求头</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>请求体</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>注释</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>发布</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>删除</th>");
                        headerRow.append("<th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>修改</th>");
                        thead.append(headerRow);
                        
                        // 表体
                        $.each(data_list, function (index, item_data) {
                            var row = $("<tr class='hover:bg-gray-50'></tr>");
                            console.log("item_data:", item_data);
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.id || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.hoster_name || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900'>" + (item_data.name || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.base_url || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.api_path || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.method || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.headers || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.body || '') + "</td>");
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>" + (item_data.desc || '') + "</td>");
                            // 创建可点击的发布按钮
                            console.log("item_data.id:", item_data.id);
                            var publishButton = createPublishButton(item_data.id, item_data.publish);
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm'>" + publishButton + "</td>");
                            var deleteButton = createDeleteButton(item_data.id);
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm'>" + deleteButton + "</td>");
                            var editButton = createEditButton(item_data.id);
                            row.append("<td class='px-6 py-4 whitespace-nowrap text-sm'>" + editButton + "</td>");
                            tbody.append(row);
                        });
                        
                        table.append(thead, tbody);
                        $("#results").append(table);
                    }
                },
                error: function (xhr, status, error) {
                    console.log("请求失败", error);
                }
            });
        });

    });
        function createEditButton(apiId) {
            return '<button class="edit-btn bg-yellow-500 hover:bg-yellow-600 text-white py-1 px-3 rounded text-xs focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" data-api-id="' + apiId + '">修改</button>';
        }

                // 添加编辑按钮点击事件监听器
        $(document).on('click', '.edit-btn', function() {
            var apiId = $(this).data('api-id');

            // 查找当前行的数据并填充到编辑表单
            var row = $(this).closest('tr');
            $('#edit_api_id').val(apiId);
            $('#edit_api_name').val(row.children().eq(2).text()); // 接口名称
            $('#edit_url').val(row.children().eq(3).text());      // 域名
            $('#edit_api_path').val(row.children().eq(4).text()); // 接口路径
            $('#edit_method').val(row.children().eq(5).text());   // 请求方式
            $('#edit_headers').val(row.children().eq(6).text());  // 请求头
            $('#edit_body').val(row.children().eq(7).text());     // 请求体
            $('#edit_annotation').val(row.children().eq(8).text()); // 注释

            // 显示编辑弹窗
            $('#editModal').show();
        });

        // 关闭编辑弹窗
        $('.close-edit').click(function() {
            $('#editModal').hide();
        });

        // 确定修改按钮点击事件
        $('#confirm_edit').click(function() {
            var editApiUrl = baseUrl + updateApiPath;
            var apiId = $('#edit_api_id').val();

            var editData = {
                api_id: parseInt(apiId),
                api_name: $('#edit_api_name').val(),
                api_url: $('#edit_url').val(),
                api_path: $('#edit_api_path').val(),
                api_method: $('#edit_method').val(),
                api_header: $('#edit_headers').val(),
                api_body: $('#edit_body').val(),
                api_desc: $('#edit_annotation').val()
            };

            $.ajax({
                url: editApiUrl,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(editData),
                xhrFields: {
                    withCredentials: true
                },
                beforeSend: function(xhr, settings) {
                    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
                    if (csrfToken) {
                        xhr.setRequestHeader("X-CSRFToken", csrfToken);
                    }
                },
                success: function(response) {
                    // 更新表格中的数据显示
                    var row = $(`.edit-btn[data-api-id="${apiId}"]`).closest('tr');
                    row.children().eq(2).text(editData.api_name); // 接口名称
                    row.children().eq(3).text(editData.api_url);  // 域名
                    row.children().eq(4).text(editData.api_path); // 接口路径
                    row.children().eq(5).text(editData.api_method); // 请求方式
                    row.children().eq(6).text(editData.api_header); // 请求头
                    row.children().eq(7).text(editData.api_body);   // 请求体
                    row.children().eq(8).text(editData.api_desc);   // 注释

                    $('#editModal').hide();
                    alert('接口修改成功');
                },
                error: function(xhr, status, error) {
                    console.error('修改接口失败:', error);
                    alert('修改接口失败: ' + (xhr.responseJSON?.message || '请重试'));
                }
            });
        });

        // 点击弹窗外区域关闭弹窗
        $(window).click(function(event) {
            if (event.target.id == 'editModal') {
                $('#editModal').hide();
            }
        });



        // 修改删除按钮创建函数
        function createDeleteButton(apiId) {
            return '<button class="delete-btn bg-red-500 hover:bg-red-600 text-white py-1 px-3 rounded text-xs focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" data-api-id="' + apiId + '">删除</button>';
        }

                // 添加删除按钮点击事件监听器
        $(document).on('click', '.delete-btn', function() {
            var button = $(this);
            var apiId = button.data('api-id');

            // 确认删除操作
            if (!confirm('确定要删除这个接口吗？此操作不可撤销。')) {
                return;
            }

            // 防止重复点击
            if (button.hasClass('deleting')) {
                return;
            }

            // 添加加载状态
            button.addClass('deleting opacity-75');
            button.text('删除中...');

            // 构建删除API URL
            var deleteApiUrl = baseUrl + deleteApiPath;

            // 发送删除请求
            $.ajax({
                url: deleteApiUrl,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    api_id: apiId
                }),
                xhrFields: {
                    withCredentials: true
                },
                beforeSend: function(xhr, settings) {
                    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
                    if (csrfToken) {
                        xhr.setRequestHeader("X-CSRFToken", csrfToken);
                    }
                },
                success: function(response) {
                    // 删除成功，移除对应的表格行
                    button.closest('tr').fadeOut(300, function() {
                        $(this).remove();

                        // 检查是否还有数据行，如果没有则显示"无数据"提示
                        var tableBody = $('#results table tbody');
                        if (tableBody.find('tr').length === 0) {
                            tableBody.append('<tr><td colspan="12" class="px-6 py-4 text-center text-sm text-gray-500">暂无数据</td></tr>');
                        }
                    });

                    alert('接口删除成功');
                },
                error: function(xhr, status, error) {
                    // 恢复按钮状态
                    button.removeClass('deleting opacity-75');
                    button.text('删除');

                    console.error('删除接口失败:', error);
                    alert('删除接口失败: ' + (xhr.responseJSON?.message || '请重试'));
                }
            });
        });
        function createPublishButton(apiId, isPublished) {
            var buttonClass = isPublished ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600';
            var buttonText = isPublished ? '已发布' : '未发布';
            var buttonId = 'publish_btn_' + apiId;

            return '<button id="' + buttonId + '" data-api-id="' + apiId + '" data-status="' + isPublished + '" class="publish-btn ' + buttonClass + ' text-white py-1 px-3 rounded text-xs focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">' + buttonText + '</button>';
        }
            // 添加发布按钮点击事件监听器
        $(document).on('click', '.publish-btn', function() {
            var button = $(this);
            var apiId = button.data('api-id');
            var currentStatus = button.data('status');
            var newStatus = !currentStatus;  // 切换状态

            // 防止重复点击
            if (button.hasClass('updating')) {
                return;
            }

            // 添加加载状态
            button.addClass('updating opacity-75');
            button.text('处理中...');

            // 构建API URL（假设有一个切换发布状态的API）
            var togglePublishUrl = baseUrl + updateApiPath;

            // 发送请求切换发布状态
            $.ajax({
                url: togglePublishUrl,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    api_id: apiId,
                    publish: newStatus
                }),
                xhrFields: {
                    withCredentials: true
                },
                beforeSend: function(xhr, settings) {
                    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
                    if (csrfToken) {
                        xhr.setRequestHeader("X-CSRFToken", csrfToken);
                    }
                },
                success: function(response) {
                    // 成功后更新按钮状态
                    button.removeClass('bg-red-500 bg-green-500 updating opacity-75');
                    button.addClass(newStatus ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600');
                    button.text(newStatus ? '已发布' : '未发布');
                    button.data('status', newStatus);
                    alert('发布状态更新成功')
                },
                error: function(xhr, status, error) {
                    // 失败时恢复原状态
                    button.removeClass('updating opacity-75');
                    button.text(currentStatus ? '已发布' : '未发布');
                    button.removeClass('bg-red-500 bg-green-500');
                    button.addClass(currentStatus ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600');

                    console.error('发布状态更新失败:', error);
                    alert('发布状态更新失败，请重试');
                }
            });
});
</script>

</html>
