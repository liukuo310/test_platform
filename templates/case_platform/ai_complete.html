<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能生成测试用例</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        .loading-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .case-card {
            transition: all 0.3s ease;
        }

        .case-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-50 font-sans min-h-screen">

    <!-- 主容器 -->
    <div class="container mx-auto py-8 px-6 max-w-7xl">

        <!-- 页面标题 -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                <i class="fas fa-magic text-purple-600 mr-3"></i>AI 智能生成测试用例
            </h1>
            <p class="text-gray-600 text-lg">输入需求描述，AI 将自动为您生成专业的测试用例</p>
        </div>

        <!-- 需求输入区域 -->
        <div class="bg-white rounded-xl shadow-lg p-8 mb-6">
            <div class="flex items-center mb-6">
                <i class="fas fa-file-alt text-purple-600 text-2xl mr-3"></i>
                <h2 class="text-2xl font-bold text-gray-800">需求描述</h2>
            </div>

            <div class="mb-6">
                <label for="requirement_input" class="block text-sm font-medium text-gray-700 mb-2">
                    <span class="text-red-500">*</span> 请输入需求文档或需求描述
                </label>
                <textarea id="requirement_input" rows="8" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-base" placeholder="例如：&#10;用户登录功能需求：&#10;1. 用户可以通过手机号和密码登录&#10;2. 支持验证码登录方式&#10;3. 密码错误超过5次锁定账号30分钟&#10;4. 登录成功后跳转到首页&#10;5. 支持记住登录状态7天"></textarea>
            </div>

            <div class="mb-6">
                <label for="api_key_input" class="block text-sm font-medium text-gray-700 mb-2">
                    AI API Key（可选）
                </label>
                <input type="password" id="api_key_input" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-base" placeholder="如果不配置，将使用系统默认 API Key">
            </div>

            <div class="flex justify-end gap-4">
                <button onclick="window.location.href='/test_case/case_main/'" class="px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all duration-200 flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i> 返回
                </button>
                <button id="generate_btn" class="px-8 py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-200 flex items-center gap-2 shadow-lg">
                    <i class="fas fa-robot"></i> 智能生成
                </button>
            </div>
        </div>

        <!-- 加载提示 -->
        <div id="loading_indicator" class="hidden bg-white rounded-xl shadow-lg p-12 mb-6 text-center">
            <div class="loading-spinner inline-block w-16 h-16 border-4 border-purple-200 border-t-purple-600 rounded-full mb-4"></div>
            <p class="text-lg text-gray-700">AI 正在分析需求并生成测试用例...</p>
            <p class="text-sm text-gray-500 mt-2">这可能需要几秒钟时间</p>
        </div>

        <!-- 生成结果区域 -->
        <div id="result_section" class="hidden bg-white rounded-xl shadow-lg p-8 mb-6 fade-in">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center">
                    <i class="fas fa-check-circle text-green-600 text-2xl mr-3"></i>
                    <h2 class="text-2xl font-bold text-gray-800">生成结果</h2>
                </div>
                <div class="text-sm text-gray-600">
                    共生成 <span id="generated_count" class="font-semibold text-purple-600">0</span> 个测试用例
                </div>
            </div>

            <!-- 生成的用例列表 -->
            <div id="generated_cases_list" class="space-y-4 mb-6">
                <!-- 动态插入用例卡片 -->
            </div>

            <!-- 操作按钮 -->
            <div class="flex justify-end gap-4 pt-6 border-t border-gray-200">
                <button id="regenerate_btn" class="px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all duration-200 flex items-center gap-2">
                    <i class="fas fa-redo"></i> 重新生成
                </button>
                <button id="confirm_create_btn" class="px-8 py-3 bg-gradient-to-r from-green-600 to-blue-600 hover:from-green-700 hover:to-blue-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all duration-200 flex items-center gap-2 shadow-lg">
                    <i class="fas fa-check"></i> 确认创建
                </button>
            </div>
        </div>

        <!-- 错误提示 -->
        <div id="error_message" class="hidden bg-red-50 border-l-4 border-red-500 p-6 rounded-lg mb-6">
            <div class="flex items-start">
                <i class="fas fa-exclamation-triangle text-red-500 text-xl mr-3 mt-0.5"></i>
                <div>
                    <h3 class="text-lg font-semibold text-red-800 mb-2">生成失败</h3>
                    <p id="error_text" class="text-red-700"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let generatedCases = [];

        // 智能生成用例
        document.getElementById('generate_btn').addEventListener('click', async function() {
            const requirementText = document.getElementById('requirement_input').value.trim();

            if (!requirementText) {
                showError('请输入需求描述');
                return;
            }

            if (requirementText.length < 10) {
                showError('需求描述过于简短，请提供更详细的信息');
                return;
            }

            // 显示加载提示
            showLoading();
            hideError();
            hideResult();

            try {
                const apiKey = document.getElementById('api_key_input').value.trim();

                const requestBody = {
                    requirement_text: requirementText
                };

                if (apiKey) {
                    requestBody.api_key = apiKey;
                }

                const response = await fetch('/test_case/generate_test_case/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();

                hideLoading();

                if (result.status === 'success') {
                    generatedCases = result.data;
                    displayGeneratedCases(result.data);
                    showResult();
                } else {
                    showError(result.message || '生成失败，请重试');
                }
            } catch (error) {
                hideLoading();
                console.error('请求失败:', error);
                showError('网络错误，请稍后重试');
            }
        });

        // 显示生成的用例
        function displayGeneratedCases(cases) {
            const container = document.getElementById('generated_cases_list');
            const countElement = document.getElementById('generated_count');

            countElement.textContent = cases.length;
            container.innerHTML = '';

            cases.forEach((testCase, index) => {
                const caseCard = createCaseCard(testCase, index);
                container.appendChild(caseCard);
            });
        }

        // 创建用例卡片
        function createCaseCard(testCase, index) {
            const card = document.createElement('div');
            card.className = 'case-card bg-gradient-to-br from-gray-50 to-white border border-gray-200 rounded-lg p-6';

            const stepsHtml = testCase.case_steps && testCase.case_steps.length > 0
                ? testCase.case_steps.map(step => `
                    <div class="mb-2 pl-4 border-l-2 border-blue-300">
                        <p class="text-sm text-gray-700"><strong>步骤 ${step.step_number}:</strong> ${step.step_description}</p>
                        <p class="text-xs text-gray-600 mt-1"><strong>预期结果:</strong> ${step.expected_result}</p>
                    </div>
                `).join('')
                : '<p class="text-sm text-gray-500">暂无步骤信息</p>';

            const assertsHtml = testCase.case_asserts && testCase.case_asserts.length > 0
                ? testCase.case_asserts.map(assert => `
                    <div class="inline-block bg-purple-100 text-purple-800 text-xs px-3 py-1 rounded-full mr-2 mb-1">
                        <i class="fas fa-check-double mr-1"></i>${assert.assert_type}: ${assert.assert_field}
                    </div>
                `).join('')
                : '<p class="text-sm text-gray-500">暂无断言信息</p>';

            card.innerHTML = `
                <div class="flex items-start justify-between mb-4">
                    <div class="flex-1">
                        <div class="flex items-center mb-2">
                            <span class="inline-flex items-center justify-center w-8 h-8 bg-purple-600 text-white rounded-full text-sm font-bold mr-3">
                                ${index + 1}
                            </span>
                            <h3 class="text-lg font-bold text-gray-800">${testCase.name}</h3>
                        </div>
                        <div class="flex items-center gap-3 mb-2">
                            <span class="inline-block bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full">
                                <i class="fas fa-tag mr-1"></i>${testCase.case_tag || '未分类'}
                            </span>
                            <span class="inline-block bg-yellow-100 text-yellow-800 text-xs px-3 py-1 rounded-full">
                                <i class="fas fa-user mr-1"></i>${testCase.hoster_name}
                            </span>
                        </div>
                    </div>
                </div>

                ${testCase.annotation ? `
                    <div class="mb-4">
                        <p class="text-sm text-gray-600"><strong>用例描述:</strong> ${testCase.annotation}</p>
                    </div>
                ` : ''}

                ${testCase.case_setup ? `
                    <div class="mb-3 bg-green-50 border-l-4 border-green-400 p-3 rounded">
                        <p class="text-sm text-gray-700"><strong>前置条件:</strong> ${testCase.case_setup}</p>
                    </div>
                ` : ''}

                <div class="mb-4">
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-list-ol text-blue-600 mr-1"></i>测试步骤
                    </h4>
                    <div class="bg-white rounded p-3">
                        ${stepsHtml}
                    </div>
                </div>

                <div class="mb-3">
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-check-circle text-purple-600 mr-1"></i>断言规则
                    </h4>
                    <div>
                        ${assertsHtml}
                    </div>
                </div>

                ${testCase.case_teardown ? `
                    <div class="bg-orange-50 border-l-4 border-orange-400 p-3 rounded">
                        <p class="text-sm text-gray-700"><strong>后置条件:</strong> ${testCase.case_teardown}</p>
                    </div>
                ` : ''}
            `;

            return card;
        }

        // 确认创建用例
        document.getElementById('confirm_create_btn').addEventListener('click', async function() {
            if (generatedCases.length === 0) {
                showError('没有可创建的用例');
                return;
            }

            const confirmBtn = document.getElementById('confirm_create_btn');
            const originalHtml = confirmBtn.innerHTML;
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fas fa-spinner loading-spinner"></i> 创建中...';

            try {
                let successCount = 0;
                let failCount = 0;

                for (const testCase of generatedCases) {
                    const response = await fetch('/test_case/create', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name: testCase.name,
                            hoster_name: testCase.hoster_name,
                            models: testCase.case_models || [],
                            tag: testCase.case_tag,
                            annotation: testCase.annotation,
                            case_setup: testCase.case_setup,
                            case_teardown: testCase.case_teardown,
                            case_steps: testCase.case_steps,
                            case_asserts: testCase.case_asserts,
                            exec_status: testCase.exec_status,
                            last_update_person: testCase.last_update_person
                        })
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        successCount++;
                    } else {
                        failCount++;
                        console.error(`创建用例 "${testCase.name}" 失败:`, result.message);
                    }
                }

                confirmBtn.disabled = false;
                confirmBtn.innerHTML = originalHtml;

                if (failCount === 0) {
                    alert(`成功创建 ${successCount} 个测试用例！`);
                    window.location.href = '/test_case/case_main/';
                } else {
                    alert(`创建完成：成功 ${successCount} 个，失败 ${failCount} 个`);
                }
            } catch (error) {
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = originalHtml;
                console.error('创建失败:', error);
                showError('创建用例时发生网络错误，请重试');
            }
        });

        // 重新生成
        document.getElementById('regenerate_btn').addEventListener('click', function() {
            document.getElementById('generate_btn').click();
        });

        // 显示/隐藏元素
        function showLoading() {
            document.getElementById('loading_indicator').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading_indicator').classList.add('hidden');
        }

        function showResult() {
            document.getElementById('result_section').classList.remove('hidden');
        }

        function hideResult() {
            document.getElementById('result_section').classList.add('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error_message');
            const errorText = document.getElementById('error_text');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');

            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        function hideError() {
            document.getElementById('error_message').classList.add('hidden');
        }
    </script>

</body>
</html>
