<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能生成测试用例</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        .loading-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .case-card {
            transition: all 0.3s ease;
        }

        .case-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .edit-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .edit-modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 900px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-50 font-sans min-h-screen">

    <!-- 主容器 -->
    <div class="container mx-auto py-8 px-6 max-w-7xl">

        <!-- 页面标题 -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                <i class="fas fa-magic text-purple-600 mr-3"></i>AI 智能生成测试用例
            </h1>
            <p class="text-gray-600 text-lg">输入需求描述，AI 将自动为您生成专业的测试用例</p>
        </div>

        <!-- 需求输入区域 -->
        <div class="bg-white rounded-xl shadow-lg p-8 mb-6">
            <div class="flex items-center mb-6">
                <i class="fas fa-file-alt text-purple-600 text-2xl mr-3"></i>
                <h2 class="text-2xl font-bold text-gray-800">需求描述</h2>
            </div>

            <div class="mb-6">
                <label for="requirement_input" class="block text-sm font-medium text-gray-700 mb-2">
                    <span class="text-red-500">*</span> 请输入需求文档或需求描述
                </label>
                <textarea id="requirement_input" rows="8" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-base" placeholder="例如：&#10;用户登录功能需求：&#10;1. 用户可以通过手机号和密码登录&#10;2. 支持验证码登录方式&#10;3. 密码错误超过5次锁定账号30分钟&#10;4. 登录成功后跳转到首页&#10;5. 支持记住登录状态7天"></textarea>
            </div>

            <div class="mb-6">
                <label for="api_key_input" class="block text-sm font-medium text-gray-700 mb-2">
                    AI API Key（可选）
                </label>
                <input type="password" id="api_key_input" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-base" placeholder="如果不配置，将使用系统默认 API Key">
            </div>

            <div class="mb-6">
                <label for="code_url_input" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-code text-blue-600 mr-1"></i>代码地址或代码片段（可选）
                </label>
                <textarea id="code_url_input" rows="4" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-base font-mono text-sm" placeholder="例如：&#10;Git 仓库地址：https://github.com/user/repo.git&#10;或&#10;直接粘贴代码片段：&#10;def login(username, password):&#10;    if not username or not password:&#10;        return {'error': '账号密码不能为空'}&#10;    ..."></textarea>
                <p class="text-xs text-gray-500 mt-2">
                    <i class="fas fa-info-circle mr-1"></i>提供代码后，AI 将分析代码逻辑，生成覆盖率更高的测试用例
                </p>
            </div>

            <div class="flex justify-end gap-4">
                <button onclick="window.location.href='/test_case/case_main/'" class="px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all duration-200 flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i> 返回
                </button>
                <button id="generate_btn" class="px-8 py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-200 flex items-center gap-2 shadow-lg">
                    <i class="fas fa-robot"></i> 智能生成
                </button>
            </div>
        </div>

        <!-- 加载提示 -->
        <div id="loading_indicator" class="hidden bg-white rounded-xl shadow-lg p-12 mb-6 text-center">
            <div class="loading-spinner inline-block w-16 h-16 border-4 border-purple-200 border-t-purple-600 rounded-full mb-4"></div>
            <p class="text-lg text-gray-700">AI 正在分析需求并生成测试用例...</p>
            <p class="text-sm text-gray-500 mt-2">这可能需要几秒钟时间</p>
        </div>

        <!-- 生成结果区域 -->
        <div id="result_section" class="hidden bg-white rounded-xl shadow-lg p-8 mb-6 fade-in">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center">
                    <i class="fas fa-check-circle text-green-600 text-2xl mr-3"></i>
                    <h2 class="text-2xl font-bold text-gray-800">生成结果</h2>
                </div>
                <div class="text-sm text-gray-600">
                    共生成 <span id="generated_count" class="font-semibold text-purple-600">0</span> 个测试用例
                </div>
            </div>

            <!-- 生成的用例列表 -->
            <div id="generated_cases_list" class="space-y-4 mb-6">
                <!-- 动态插入用例卡片 -->
            </div>

            <!-- 操作按钮 -->
            <div class="flex justify-end gap-4 pt-6 border-t border-gray-200">
                <button id="regenerate_btn" class="px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all duration-200 flex items-center gap-2">
                    <i class="fas fa-redo"></i> 重新生成
                </button>
                <button id="confirm_create_btn" class="px-8 py-3 bg-gradient-to-r from-green-600 to-blue-600 hover:from-green-700 hover:to-blue-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all duration-200 flex items-center gap-2 shadow-lg">
                    <i class="fas fa-check"></i> 确认创建
                </button>
            </div>
        </div>

        <!-- 错误提示 -->
        <div id="error_message" class="hidden bg-red-50 border-l-4 border-red-500 p-6 rounded-lg mb-6">
            <div class="flex items-start">
                <i class="fas fa-exclamation-triangle text-red-500 text-xl mr-3 mt-0.5"></i>
                <div>
                    <h3 class="text-lg font-semibold text-red-800 mb-2">生成失败</h3>
                    <p id="error_text" class="text-red-700"></p>
                </div>
            </div>
        </div>
    </div>


    <!-- 编辑用例弹窗 -->
    <div id="edit_modal" class="edit-modal">
        <div class="modal-content">
            <div class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-4 rounded-t-xl flex justify-between items-center">
                <h3 class="text-xl font-bold">
                    <i class="fas fa-edit mr-2"></i>编辑测试用例
                </h3>
                <button onclick="closeEditModal()" class="text-white hover:text-gray-200 transition">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <input type="hidden" id="edit_case_index">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <span class="text-red-500">*</span> 用例名称
                    </label>
                    <input type="text" id="edit_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">负责人</label>
                        <input type="text" id="edit_hoster_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">标签</label>
                        <input type="text" id="edit_case_tag" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">用例描述</label>
                    <textarea id="edit_annotation" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">前置条件</label>
                    <textarea id="edit_case_setup" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">后置条件</label>
                    <textarea id="edit_case_teardown" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-list-ol text-blue-600 mr-1"></i>测试步骤
                    </label>
                    <div id="edit_steps_container" class="space-y-3">
                        <!-- 动态插入步骤输入框 -->
                    </div>
                    <button onclick="addEditStep()" class="mt-3 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm transition">
                        <i class="fas fa-plus mr-1"></i>添加步骤
                    </button>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-check-circle text-purple-600 mr-1"></i>预期结果
                    </label>
                    <textarea id="edit_case_asserts" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="请输入预期结果描述..."></textarea>
                </div>
            </div>

            <div class="border-t border-gray-200 px-6 py-4 flex justify-end gap-3 rounded-b-xl">
                <button onclick="closeEditModal()" class="px-6 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg transition">
                    取消
                </button>
                <button onclick="saveEditCase()" class="px-6 py-2 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white rounded-lg transition shadow-lg">
                    <i class="fas fa-save mr-1"></i>保存
                </button>
            </div>
        </div>
    </div>

    <script>
        let generatedCases = [];

        // 智能生成用例
        document.getElementById('generate_btn').addEventListener('click', async function() {
            const requirementText = document.getElementById('requirement_input').value.trim();

            if (!requirementText) {
                showError('请输入需求描述');
                return;
            }

            if (requirementText.length < 10) {
                showError('需求描述过于简短，请提供更详细的信息');
                return;
            }

            // 显示加载提示
            showLoading();
            hideError();
            hideResult();

            try {
                const apiKey = document.getElementById('api_key_input').value.trim();

                const requestBody = {
                    requirement_text: requirementText
                };

                if (apiKey) {
                    requestBody.api_key = apiKey;
                }

                const codeUrl = document.getElementById('code_url_input').value.trim();
                if (codeUrl) {
                    requestBody.code_url = codeUrl;
                }

                const response = await fetch('/test_case/generate_test_case/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();

                hideLoading();

                if (result.status === 'success') {
                    generatedCases = result.data;
                    displayGeneratedCases(result.data);
                    showResult();
                } else {
                    showError(result.message || '生成失败，请重试');
                }
            } catch (error) {
                hideLoading();
                console.error('请求失败:', error);
                showError('网络错误，请稍后重试');
            }
        });

        // 显示生成的用例
        function displayGeneratedCases(cases) {
            const container = document.getElementById('generated_cases_list');
            const countElement = document.getElementById('generated_count');

            if (!cases || !Array.isArray(cases)) {
                console.error('用例数据无效:', cases);
                showError('用例数据格式错误');
                return;
            }

            countElement.textContent = cases.length;
            container.innerHTML = '';

            cases.forEach((testCase, index) => {
                try {
                    const caseCard = createCaseCard(testCase, index);
                    container.appendChild(caseCard);
                } catch (error) {
                    console.error(`渲染用例 ${index} 失败:`, error);
                }
            });
        }
        // 创建用例卡片
        function createCaseCard(testCase, index) {
            const card = document.createElement('div');
            card.className = 'case-card bg-gradient-to-br from-gray-50 to-white border border-gray-200 rounded-lg p-6';

            const stepsHtml = testCase.case_steps && testCase.case_steps.length > 0
                ? testCase.case_steps.map(step => `
                    <div class="mb-2 pl-4 border-l-2 border-blue-300">
                        <p class="text-sm text-gray-700"><strong>步骤 ${step.step_number}:</strong> ${step.step_description}</p>
                        <p class="text-xs text-gray-600 mt-1"><strong>预期结果:</strong> ${step.expected_result}</p>
                    </div>
                `).join('')
                : '<p class="text-sm text-gray-500">暂无步骤信息</p>';

            const assertsHtml = testCase.case_asserts && testCase.case_asserts.length > 0
                ? (Array.isArray(testCase.case_asserts)
                    ? testCase.case_asserts.map(assert => `
                        <div class="inline-block bg-purple-100 text-purple-800 text-xs px-3 py-1 rounded-full mr-2 mb-1">
                            <i class="fas fa-check-double mr-1"></i>${assert.assert_type}: ${assert.assert_field}
                        </div>
                    `).join('')
                    : `<div class="text-sm text-gray-700">${testCase.case_asserts}</div>`)
                : '<p class="text-sm text-gray-500">暂无预期结果</p>';

            card.innerHTML = `
                <div class="absolute top-4 right-4 flex gap-2">
                    <button onclick="editCase(${index})" class="px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white text-sm rounded-lg transition shadow-md" title="编辑">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button onclick="deleteCase(${index})" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white text-sm rounded-lg transition shadow-md" title="删除">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>

                <div class="flex items-start justify-between mb-4">
                    <div class="flex-1">
                        <div class="flex items-center mb-2">
                            <span class="inline-flex items-center justify-center w-8 h-8 bg-purple-600 text-white rounded-full text-sm font-bold mr-3">
                                ${index + 1}
                            </span>
                            <h3 class="text-lg font-bold text-gray-800">${testCase.name}</h3>
                        </div>
                        <div class="flex items-center gap-3 mb-2">
                            <span class="inline-block bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full">
                                <i class="fas fa-tag mr-1"></i>${testCase.case_tag || '未分类'}
                            </span>
                            <span class="inline-block bg-yellow-100 text-yellow-800 text-xs px-3 py-1 rounded-full">
                                <i class="fas fa-user mr-1"></i>${testCase.hoster_name}
                            </span>
                        </div>
                    </div>
                </div>

                ${testCase.annotation ? `
                    <div class="mb-4">
                        <p class="text-sm text-gray-600"><strong>用例描述:</strong> ${testCase.annotation}</p>
                    </div>
                ` : ''}

                ${testCase.case_setup ? `
                    <div class="mb-3 bg-green-50 border-l-4 border-green-400 p-3 rounded">
                        <p class="text-sm text-gray-700"><strong>前置条件:</strong> ${testCase.case_setup}</p>
                    </div>
                ` : ''}

                <div class="mb-4">
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-list-ol text-blue-600 mr-1"></i>测试步骤
                    </h4>
                    <div class="bg-white rounded p-3">
                        ${stepsHtml}
                    </div>
                </div>

                <div class="mb-3">
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-check-circle text-purple-600 mr-1"></i>预期结果
                    </h4>
                    <div>
                        ${assertsHtml}
                    </div>
                </div>

                ${testCase.case_teardown ? `
                    <div class="bg-orange-50 border-l-4 border-orange-400 p-3 rounded">
                        <p class="text-sm text-gray-700"><strong>后置条件:</strong> ${testCase.case_teardown}</p>
                    </div>
                ` : ''}
            `;

            return card;
        }

        // 编辑用例
        function editCase(index) {
            const testCase = generatedCases[index];
            document.getElementById('edit_case_index').value = index;
            document.getElementById('edit_name').value = testCase.name || '';
            document.getElementById('edit_hoster_name').value = testCase.hoster_name || '';
            document.getElementById('edit_case_tag').value = testCase.case_tag || '';
            document.getElementById('edit_annotation').value = testCase.annotation || '';
            document.getElementById('edit_case_setup').value = testCase.case_setup || '';
            document.getElementById('edit_case_teardown').value = testCase.case_teardown || '';
            document.getElementById('edit_case_asserts').value = testCase.case_asserts || '';

            // 渲染步骤
            const stepsContainer = document.getElementById('edit_steps_container');
            stepsContainer.innerHTML = '';
            if (testCase.case_steps && testCase.case_steps.length > 0) {
                testCase.case_steps.forEach((step, stepIndex) => {
                    addStepToEditModal(step, stepIndex);
                });
            } else {
                addStepToEditModal(null, 0);
            }

            // 显示弹窗
            document.getElementById('edit_modal').classList.add('show');
        }

        // 关闭编辑弹窗
        function closeEditModal() {
            document.getElementById('edit_modal').classList.remove('show');
        }

        // 添加步骤到编辑弹窗
        function addStepToEditModal(step = null, index = 0) {
            const container = document.getElementById('edit_steps_container');
            const stepDiv = document.createElement('div');
            stepDiv.className = 'bg-gray-50 border border-gray-200 rounded-lg p-3';
            stepDiv.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-semibold text-gray-700">步骤 ${index + 1}</span>
                    <button onclick="removeStep(this)" class="text-red-500 hover:text-red-700 text-sm">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="space-y-2">
                    <input type="number" placeholder="步骤序号" value="${step ? step.step_number : index + 1}" class="step-number w-full px-3 py-2 border border-gray-300 rounded text-sm">
                    <input type="text" placeholder="步骤描述" value="${step ? step.step_description : ''}" class="step-description w-full px-3 py-2 border border-gray-300 rounded text-sm">
                    <input type="text" placeholder="预期结果" value="${step ? step.expected_result : ''}" class="step-expected-result w-full px-3 py-2 border border-gray-300 rounded text-sm">
                </div>
            `;
            container.appendChild(stepDiv);
        }

        function addEditStep() {
            const container = document.getElementById('edit_steps_container');
            const index = container.children.length;
            addStepToEditModal(null, index);
        }

        function removeStep(btn) {
            btn.closest('.bg-gray-50').remove();
            // 重新编号
            const steps = document.querySelectorAll('#edit_steps_container > div');
            steps.forEach((step, idx) => {
                step.querySelector('span').textContent = `步骤 ${idx + 1}`;
            });
        }

        // 保存编辑的用例
        function saveEditCase() {
            const index = parseInt(document.getElementById('edit_case_index').value);

            // 收集步骤数据
            const steps = [];
            const stepElements = document.querySelectorAll('#edit_steps_container > div');
            stepElements.forEach((stepEl, idx) => {
                steps.push({
                    step_number: parseInt(stepEl.querySelector('.step-number').value) || idx + 1,
                    step_description: stepEl.querySelector('.step-description').value,
                    expected_result: stepEl.querySelector('.step-expected-result').value
                });
            });

            // 更新用例数据
            generatedCases[index] = {
                ...generatedCases[index],
                name: document.getElementById('edit_name').value,
                hoster_name: document.getElementById('edit_hoster_name').value,
                case_tag: document.getElementById('edit_case_tag').value,
                annotation: document.getElementById('edit_annotation').value,
                case_setup: document.getElementById('edit_case_setup').value,
                case_teardown: document.getElementById('edit_case_teardown').value,
                case_steps: steps,
                case_asserts: document.getElementById('edit_case_asserts').value
            };

            try {
                displayGeneratedCases(generatedCases);
                closeEditModal();
            } catch (error) {
                console.error('刷新显示失败:', error);
                alert('保存成功，但刷新显示时出错：' + error.message);
            }
        }

        // 删除用例
        function deleteCase(index) {
            if (confirm(`确定要删除测试用例 "${generatedCases[index].name}" 吗？`)) {
                generatedCases.splice(index, 1);
                displayGeneratedCases(generatedCases);
            }
        }

        // 确认创建用例
        document.getElementById('confirm_create_btn').addEventListener('click', async function() {
            if (generatedCases.length === 0) {
                showError('没有可创建的用例');
                return;
            }

            const confirmBtn = document.getElementById('confirm_create_btn');
            const originalHtml = confirmBtn.innerHTML;
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fas fa-spinner loading-spinner"></i> 创建中...';

            try {
                let successCount = 0;
                let failCount = 0;

                for (const testCase of generatedCases) {
                    const response = await fetch('/test_case/create', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name: testCase.name,
                            hoster_name: testCase.hoster_name,
                            models: testCase.case_models || [],
                            tag: testCase.case_tag,
                            annotation: testCase.annotation,
                            case_setup: testCase.case_setup,
                            case_teardown: testCase.case_teardown,
                            case_steps: testCase.case_steps,
                            case_asserts: testCase.case_asserts,
                            exec_status: testCase.exec_status,
                            last_update_person: testCase.last_update_person
                        })
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        successCount++;
                    } else {
                        failCount++;
                        console.error(`创建用例 "${testCase.name}" 失败:`, result.message);
                    }
                }

                confirmBtn.disabled = false;
                confirmBtn.innerHTML = originalHtml;

                if (failCount === 0) {
                    alert(`成功创建 ${successCount} 个测试用例！`);
                    window.location.href = '/test_case/case_main/';
                } else {
                    alert(`创建完成：成功 ${successCount} 个，失败 ${failCount} 个`);
                }
            } catch (error) {
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = originalHtml;
                console.error('创建失败:', error);
                showError('创建用例时发生网络错误，请重试');
            }
        });

        // 重新生成
        document.getElementById('regenerate_btn').addEventListener('click', function() {
            document.getElementById('generate_btn').click();
        });

        // 显示/隐藏元素
        function showLoading() {
            document.getElementById('loading_indicator').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading_indicator').classList.add('hidden');
        }

        function showResult() {
            document.getElementById('result_section').classList.remove('hidden');
        }

        function hideResult() {
            document.getElementById('result_section').classList.add('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error_message');
            const errorText = document.getElementById('error_text');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');

            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        function hideError() {
            document.getElementById('error_message').classList.add('hidden');
        }
    </script>

</body>
</html>
