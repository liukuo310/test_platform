<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量导入测试用例</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .upload-area {
            transition: all 0.3s ease;
            border: 2px dashed #d1d5db;
        }

        .upload-area:hover {
            border-color: #8b5cf6;
            background-color: #faf5ff;
        }

        .upload-area.dragover {
            border-color: #8b5cf6;
            background-color: #f3e8ff;
        }

        .mapping-select {
            transition: all 0.2s;
        }

        .mapping-select:focus {
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-green-50 via-blue-50 to-purple-50 font-sans min-h-screen">

    <!-- 主容器 -->
    <div class="container mx-auto py-8 px-6 max-w-7xl">

        <!-- 页面标题 -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                <i class="fas fa-file-import text-green-600 mr-3"></i>批量导入测试用例
            </h1>
            <p class="text-gray-600 text-lg">上传 Excel/CSV 文件，快速批量导入测试用例</p>
        </div>

        <!-- 文件上传区域 -->
        <div class="bg-white rounded-xl shadow-lg p-8 mb-6">
            <div class="flex items-center mb-6">
                <i class="fas fa-cloud-upload-alt text-green-600 text-2xl mr-3"></i>
                <h2 class="text-2xl font-bold text-gray-800">上传文件</h2>
            </div>

            <div id="upload_area" class="upload-area rounded-lg p-12 text-center cursor-pointer bg-gray-50">
                <input type="file" id="file_input" accept=".xlsx,.xls,.csv" class="hidden">
                <i class="fas fa-file-excel text-6xl text-green-500 mb-4"></i>
                <p class="text-lg text-gray-700 mb-2">点击或拖拽文件到此处上传</p>
                <p class="text-sm text-gray-500">支持格式：Excel (.xlsx, .xls)、CSV (.csv)</p>
            </div>

            <div id="file_info" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <i class="fas fa-check-circle text-green-600 text-xl mr-3"></i>
                        <div>
                            <p id="file_name" class="font-semibold text-gray-800"></p>
                            <p id="file_size" class="text-sm text-gray-600"></p>
                        </div>
                    </div>
                    <button id="remove_file_btn" class="text-red-500 hover:text-red-700">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 列映射配置区域 -->
        <div id="mapping_section" class="hidden bg-white rounded-xl shadow-lg p-8 mb-6 fade-in">
            <div class="flex items-center mb-6">
                <i class="fas fa-cog text-blue-600 text-2xl mr-3"></i>
                <h2 class="text-2xl font-bold text-gray-800">列映射配置</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label for="start_row" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-arrow-down text-blue-500 mr-1"></i> 从第几行开始读取
                    </label>
                    <input type="number" id="start_row" value="2" min="1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-gray-500 mt-1">通常第1行是表头，从第2行开始读取数据</p>
                </div>
                <div>
                    <label for="sheet_name" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-table text-blue-500 mr-1"></i> 工作表名称
                    </label>
                    <select id="sheet_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">自动检测</option>
                    </select>
                </div>
            </div>

            <div class="border-t border-gray-200 pt-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">字段映射关系</h3>
                <p class="text-sm text-gray-600 mb-4">将表格列与用例字段对应起来（<span class="text-red-500">*</span> 为必填项）</p>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <span class="text-red-500">*</span> 用例名称
                        </label>
                        <select id="map_name" class="mapping-select w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择列</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <span class="text-red-500">*</span> 作者
                        </label>
                        <select id="map_hoster" class="mapping-select w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择列</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">标签</label>
                        <select id="map_tag" class="mapping-select w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择列</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">用例描述</label>
                        <select id="map_annotation" class="mapping-select w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择列</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">前置条件</label>
                        <select id="map_setup" class="mapping-select w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择列</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">后置条件</label>
                        <select id="map_teardown" class="mapping-select w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择列</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">测试步骤</label>
                        <select id="map_steps" class="mapping-select w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择列</option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">多个步骤用换行分隔</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">断言规则</label>
                        <select id="map_asserts" class="mapping-select w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择列</option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">多个断言用分号分隔</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-4 mt-6 pt-6 border-t border-gray-200">
                <button onclick="window.location.href='/test_case/case_main/'" class="px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all duration-200 flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i> 返回
                </button>
                <button id="preview_btn" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200 flex items-center gap-2 shadow-lg">
                    <i class="fas fa-eye"></i> 预览数据
                </button>
            </div>
        </div>

        <!-- 数据预览区域 -->
        <div id="preview_section" class="hidden bg-white rounded-xl shadow-lg p-8 mb-6 fade-in">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center">
                    <i class="fas fa-table text-purple-600 text-2xl mr-3"></i>
                    <h2 class="text-2xl font-bold text-gray-800">数据预览</h2>
                </div>
                <div class="text-sm text-gray-600">
                    共 <span id="preview_count" class="font-semibold text-purple-600">0</span> 条数据
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-lg">
                    <thead class="bg-gradient-to-r from-gray-50 to-gray-100">
                        <tr id="preview_header">
                            <!-- 动态插入表头 -->
                        </tr>
                    </thead>
                    <tbody id="preview_body" class="bg-white divide-y divide-gray-200">
                        <!-- 动态插入数据 -->
                    </tbody>
                </table>
            </div>

            <div class="flex justify-end gap-4 mt-6 pt-6 border-t border-gray-200">
                <button id="reupload_btn" class="px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all duration-200 flex items-center gap-2">
                    <i class="fas fa-redo"></i> 重新上传
                </button>
                <button id="confirm_import_btn" class="px-8 py-3 bg-gradient-to-r from-green-600 to-blue-600 hover:from-green-700 hover:to-blue-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all duration-200 flex items-center gap-2 shadow-lg">
                    <i class="fas fa-check"></i> 确认导入
                </button>
            </div>
        </div>

        <!-- 加载提示 -->
        <div id="loading_indicator" class="hidden bg-white rounded-xl shadow-lg p-12 mb-6 text-center">
            <div class="inline-block w-16 h-16 border-4 border-green-200 border-t-green-600 rounded-full mb-4 loading-spinner"></div>
            <p class="text-lg text-gray-700">正在导入用例...</p>
            <p id="import_progress" class="text-sm text-gray-500 mt-2">处理中</p>
        </div>

        <!-- 错误提示 -->
        <div id="error_message" class="hidden bg-red-50 border-l-4 border-red-500 p-6 rounded-lg mb-6">
            <div class="flex items-start">
                <i class="fas fa-exclamation-triangle text-red-500 text-xl mr-3 mt-0.5"></i>
                <div>
                    <h3 class="text-lg font-semibold text-red-800 mb-2">操作失败</h3>
                    <p id="error_text" class="text-red-700"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let workbook = null;
        let worksheet = null;
        let headers = [];
        let parsedData = [];
        let mappedCases = [];

        // 文件上传区域事件
        const uploadArea = document.getElementById('upload_area');
        const fileInput = document.getElementById('file_input');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // 处理文件
        function handleFile(file) {
            const validTypes = [
                'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                'application/vnd.ms-excel',
                'text/csv'
            ];
            const validExtensions = ['.xlsx', '.xls', '.csv'];

            const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
            if (!validExtensions.includes(fileExtension)) {
                showError('不支持的文件格式，请上传 Excel 或 CSV 文件');
                return;
            }

            // 显示文件信息
            document.getElementById('file_name').textContent = file.name;
            document.getElementById('file_size').textContent = formatFileSize(file.size);
            document.getElementById('file_info').classList.remove('hidden');

            // 读取文件
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });

                    // 填充工作表选择
                    const sheetSelect = document.getElementById('sheet_name');
                    sheetSelect.innerHTML = '<option value="">自动检测</option>';
                    workbook.SheetNames.forEach(name => {
                        const option = document.createElement('option');
                        option.value = name;
                        option.textContent = name;
                        sheetSelect.appendChild(option);
                    });

                    // 默认使用第一个工作表
                    worksheet = workbook.Sheets[workbook.SheetNames[0]];

                    // 获取表头
                    loadHeaders();

                    // 显示映射配置区域
                    document.getElementById('mapping_section').classList.remove('hidden');

                    hideError();
                } catch (error) {
                    console.error('文件解析失败:', error);
                    showError('文件解析失败，请检查文件格式是否正确');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 加载表头
        function loadHeaders() {
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            if (jsonData.length > 0) {
                headers = jsonData[0];

                // 填充所有映射下拉框
                const mappingFields = ['map_name', 'map_hoster', 'map_tag', 'map_annotation',
                                      'map_setup', 'map_teardown', 'map_steps', 'map_asserts'];

                mappingFields.forEach(fieldId => {
                    const select = document.getElementById(fieldId);
                    select.innerHTML = '<option value="">请选择列</option>';
                    headers.forEach((header, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = header || `列 ${index + 1}`;
                        select.appendChild(option);
                    });
                });
            }
        }

        // 工作表切换
        document.getElementById('sheet_name').addEventListener('change', (e) => {
            const sheetName = e.target.value;
            if (sheetName) {
                worksheet = workbook.Sheets[sheetName];
            } else {
                worksheet = workbook.Sheets[workbook.SheetNames[0]];
            }
            loadHeaders();
        });

        // 删除文件
        document.getElementById('remove_file_btn').addEventListener('click', () => {
            resetAll();
        });

        // 重新上传
        document.getElementById('reupload_btn').addEventListener('click', () => {
            resetAll();
        });

        function resetAll() {
            workbook = null;
            worksheet = null;
            headers = [];
            parsedData = [];
            mappedCases = [];

            document.getElementById('file_input').value = '';
            document.getElementById('file_info').classList.add('hidden');
            document.getElementById('mapping_section').classList.add('hidden');
            document.getElementById('preview_section').classList.add('hidden');
        }

        // 预览数据
        document.getElementById('preview_btn').addEventListener('click', () => {
            const startRow = parseInt(document.getElementById('start_row').value) || 2;

            // 验证必填字段
            const nameCol = document.getElementById('map_name').value;
            const hosterCol = document.getElementById('map_hoster').value;

            if (!nameCol) {
                showError('请至少映射"用例名称"字段');
                return;
            }
            if (!hosterCol) {
                showError('请至少映射"作者"字段');
                return;
            }

            // 解析数据
            parseData(startRow);

            if (parsedData.length === 0) {
                showError('没有读取到数据，请检查起始行设置');
                return;
            }

            // 显示预览
            displayPreview();
            document.getElementById('preview_section').classList.remove('hidden');
            hideError();
        });

        // 解析数据
        function parseData(startRow) {
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            parsedData = [];

            for (let i = startRow - 1; i < jsonData.length; i++) {
                const row = jsonData[i];
                if (!row || row.length === 0) continue;

                const nameCol = document.getElementById('map_name').value;
                const hosterCol = document.getElementById('map_hoster').value;
                const tagCol = document.getElementById('map_tag').value;
                const annotationCol = document.getElementById('map_annotation').value;
                const setupCol = document.getElementById('map_setup').value;
                const teardownCol = document.getElementById('map_teardown').value;
                const stepsCol = document.getElementById('map_steps').value;
                const assertsCol = document.getElementById('map_asserts').value;

                const testCase = {
                    name: nameCol !== '' ? (row[nameCol] || '') : '',
                    hoster_name: hosterCol !== '' ? (row[hosterCol] || '') : '',
                    case_tag: tagCol !== '' ? (row[tagCol] || '') : '',
                    annotation: annotationCol !== '' ? (row[annotationCol] || '') : '',
                    case_setup: setupCol !== '' ? (row[setupCol] || '') : '',
                    case_teardown: teardownCol !== '' ? (row[teardownCol] || '') : '',
                    case_models: [],
                    case_steps: [],
                    case_asserts: [],
                    exec_status: { status: '待执行' },
                    last_update_person: hosterCol !== '' ? (row[hosterCol] || '') : ''
                };

                // 处理测试步骤
                if (stepsCol !== '' && row[stepsCol]) {
                    const stepsText = String(row[stepsCol]);
                    const stepsList = stepsText.split('\n').filter(s => s.trim());
                    testCase.case_steps = stepsList.map((step, index) => ({
                        step_number: index + 1,
                        step_description: step.trim(),
                        expected_result: ''
                    }));
                }

                // 处理断言规则
                if (assertsCol !== '' && row[assertsCol]) {
                    const assertsText = String(row[assertsCol]);
                    const assertsList = assertsText.split(';').filter(a => a.trim());
                    testCase.case_asserts = assertsList.map(assert => ({
                        assert_type: '响应断言',
                        assert_field: assert.trim(),
                        expected_value: ''
                    }));
                }

                parsedData.push(testCase);
            }
        }

        // 显示预览
        function displayPreview() {
            const countElement = document.getElementById('preview_count');
            const headerRow = document.getElementById('preview_header');
            const tbody = document.getElementById('preview_body');

            countElement.textContent = parsedData.length;

            // 显示表头
            headerRow.innerHTML = `
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">序号</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">用例名称</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">作者</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">标签</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">步骤数</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">断言数</th>
            `;

            // 显示数据（最多显示10条）
            const displayData = parsedData.slice(0, 10);
            tbody.innerHTML = '';

            displayData.forEach((testCase, index) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-4 py-3 text-sm text-gray-900">${index + 1}</td>
                    <td class="px-4 py-3 text-sm text-gray-900 font-medium">${testCase.name}</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${testCase.hoster_name}</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${testCase.case_tag || '-'}</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${testCase.case_steps.length}</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${testCase.case_asserts.length}</td>
                `;
                tbody.appendChild(row);
            });

            if (parsedData.length > 10) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="6" class="px-4 py-3 text-sm text-gray-500 text-center italic">
                        ... 还有 ${parsedData.length - 10} 条数据未显示
                    </td>
                `;
                tbody.appendChild(row);
            }
        }

        // 确认导入
        document.getElementById('confirm_import_btn').addEventListener('click', async () => {
            if (parsedData.length === 0) {
                showError('没有可导入的数据');
                return;
            }

            const confirmBtn = document.getElementById('confirm_import_btn');
            const originalHtml = confirmBtn.innerHTML;
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fas fa-spinner loading-spinner"></i> 导入中...';

            document.getElementById('loading_indicator').classList.remove('hidden');
            document.getElementById('preview_section').classList.add('hidden');

            try {
                const response = await fetch('/test_case/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(parsedData)
                });

                const result = await response.json();

                document.getElementById('loading_indicator').classList.add('hidden');
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = originalHtml;

                if (result.status === 'success') {
                    alert(`导入成功！\n成功: ${result.data.success_count} 个\n失败: ${result.data.failed_count} 个`);
                    window.location.href = '/test_case/case_main/';
                } else {
                    showError(result.message || '导入失败');
                }
            } catch (error) {
                document.getElementById('loading_indicator').classList.add('hidden');
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = originalHtml;
                console.error('导入失败:', error);
                showError('网络错误，请稍后重试');
            }
        });

        // 工具函数
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showError(message) {
            const errorDiv = document.getElementById('error_message');
            const errorText = document.getElementById('error_text');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');

            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        function hideError() {
            document.getElementById('error_message').classList.add('hidden');
        }
    </script>

</body>
</html>
