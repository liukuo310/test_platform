<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-600 text-white py-6">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl font-bold">测试平台主页</h1>
            <p class="mt-2">提供全面的测试解决方案</p>
        </div>
    </header>
    <main class="container mx-auto py-8">
        <div id="select_list" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <a href="/test_case/case_main" class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transform hover:scale-105 transition duration-300">
                <i class="fa-solid fa-list-check text-3xl text-blue-600 mb-4"></i>
                <h2 class="text-xl font-bold text-gray-800">用例管理平台</h2>
                <p class="mt-2 text-gray-600">高效管理测试用例，提升测试效率。</p>
            </a>
            <a href="/api_platform/api_main_view" class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transform hover:scale-105 transition duration-300">
                <i class="fa-solid fa-plug text-3xl text-blue-600 mb-4"></i>
                <h2 class="text-xl font-bold text-gray-800">接口测试平台</h2>
                <p class="mt-2 text-gray-600">专业的接口测试工具，保障接口质量。</p>
            </a>
            <a href="/performance/performance_main" class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transform hover:scale-105 transition duration-300">
                <i class="fa-solid fa-chart-line text-3xl text-blue-600 mb-4"></i>
                <h2 class="text-xl font-bold text-gray-800">性能测试平台</h2>
                <p class="mt-2 text-gray-600">精准评估系统性能，优化系统体验。</p>
            </a>
        </div>
    </main>
    <footer class="bg-gray-200 py-4 mt-8">
        <div class="container mx-auto text-center text-gray-600">
            <p>&copy; 个人自主学习项目</p>
        </div>
    </footer>
</body>
</html>
