<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>平台首页</title>
    <style type="text/css">
        body {
            background-color: #f4f4f9; /* 更改背景颜色为浅灰色 */
            font-family: Arial, sans-serif; /* 设置字体 */
            margin: 0; /* 去除默认的body边距 */
            padding: 0; /* 去除默认的body填充 */
        }
        #select_list {
            line-height: 30px;
            background-color: #e0f7fa; /* 更改背景颜色为浅青色 */
            height: 300px;
            width: 200px; /* 增加宽度 */
            float: left;
            padding: 10px; /* 增加填充 */
            margin: 20px; /* 增加外边距 */
            border-radius: 5px; /* 圆角边框 */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* 添加阴影 */
        }
        #select_list a {
            text-decoration: none; /* 去除链接下划线 */
            display: block; /* 块级元素，使链接充满整个button */
        }
        #select_list button {
            width: 100%; /* 按钮宽度占满父元素 */
            height: 50px; /* 降低按钮高度 */
            background-color: #00acc1; /* 设置按钮背景颜色为青色 */
            color: white; /* 设置文字颜色为白色 */
            border: none; /* 去除边框 */
            border-radius: 5px; /* 圆角边框 */
            cursor: pointer; /* 鼠标悬停时变为指向手型 */
            transition: background-color 0.3s; /* 添加背景颜色过渡效果 */
            margin-bottom: 10px; /* 增加按钮之间的间隔 */
        }
        #select_list button:last-child {
            margin-bottom: 0; /* 最后一个按钮不需要底部间隔 */
        }
        #select_list button:hover {
            background-color: #00838f; /* 悬停时按钮背景颜色加深 */
        }
    </style>
</head>
<body>
    <div id="select_list">
        <a href="/case_management">
            <button>用例管理平台</button>
        </a>
        <a href="/api_platform/api_main_view">
            <button>接口测试平台</button>
        </a>
        <a href="/performance/performance_main">
            <button>性能测试平台</button>
        </a>
    </div>
</body>
</html>
